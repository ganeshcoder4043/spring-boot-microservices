server:
  port: 8081

spring:
  application:
    name: USERSERVICE
  config:
    import: optional:configserver:http://localhost:8085
  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: Ganesh@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true




# Actuator Configuration
management:
  health:
    circuitbreakers:
      enabled: true                         # ✅ Circuit breaker health enable
  endpoints:
    web:
      exposure:
        include: "*"    # include: health,info,metrics,prometheus ,"*" means all                     # ✅ Sab expose karo (health, info, metrics, etc.)

  endpoint:
    health:
      show-details: always                  # ✅ Detailed health info
      show-components: always               # ✅ Components details

# resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      ratingHotelCircuitBreaker:                                 # Circuit breaker ka naam (use in @CircuitBreaker annotation)
        registerHealthIndicator: true                            # Actuator health endpoint par status dikhega (true = ON)
        eventConsumerBufferSize: 10                              # Last 10 events memory mein store karega (debugging ke liye)
        failureRateThreshold: 50                                 # 50% failures hone par circuit OPEN ho jayega
        minimumNumberOfCalls: 5                                  # 5 calls ke baad hi threshold check karega (pehle nahi)
        automaticTransitionFromOpenToHalfOpenEnabled: true       # OPEN se HALF-OPEN automatically ho jayega
        waitDurationInOpenState: 6s                              # Circuit OPEN rahega 6 seconds, phir HALF-OPEN try karega
        permittedNumberOfCallsInHalfOpenState: 3                 # HALF-OPEN mein sirf 3 calls allow karenge (test ke liye)
        slidingWindowSize: 10                                    # Last 10 calls track karega (statistics ke liye)
        slidingWindowType: COUNT_BASED                           # Call count based sliding window (COUNT_BASED ya TIME_BASED)


    retry:
      instances:
        ratingHotelRetry:
          max-attempts: 3
          wait-duration: 1s
          retry-exceptions:
            - java.util.concurrent.TimeoutException
            - org.springframework.web.client.HttpServerErrorException
            - java.io.IOException
            - java.net.SocketTimeoutException
          ignore-exceptions:
            - com.microservice.user.service.exception.UserNotFoundException                   # ⬅️ 1 second gap between retries


           # ✅ Rate Limiter Configuration
    ratelimiter:
      instances:
        userRateLimiter:
          limit-for-period: 10              # ⬅️ 10 requests allow karega
          limit-refresh-period: 10s         # ⬅️ Har 10 second mein reset
          timeout-duration: 2s           # ⬅️ Wait time if limit reached
          registerHealthIndicator: true     # ⬅️ Actuator mein dikhega


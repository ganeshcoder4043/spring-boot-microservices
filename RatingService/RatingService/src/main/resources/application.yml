server:
  port: 8083

spring:
  application:
    name: RATINGSERVICE

  data:
    mongodb:
      uri: mongodb://localhost:27017/Microservice

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-4892497.okta.com/oauth2/default

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true